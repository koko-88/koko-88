<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="425" viewBox="0 0 1000 425" role="img" aria-label="Engineering Surface: AI, data, platform, product, and delivery"><defs></defs><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}</style><g class="mono"><rect x="1" y="1" width="998" height="423" rx="22" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="500" y="52" font-size="23" fill="#E6EDF3" font-weight="700" text-anchor="middle" letter-spacing="1">ENGINEERING SURFACE</text><text x="500" y="85" font-size="12" fill="#F75C7E" font-weight="500" text-anchor="middle">MODEL → SYSTEM  ·  BUILD → TEST → SECURE  ·  OBSERVE → ITERATE → SHIP</text><text x="500" y="109" font-size="12" fill="#8B949E" font-weight="400" text-anchor="middle">AI · DATA · PLATFORM · PRODUCT · DELIVERY</text><line x1="42" y1="130" x2="958" y2="130" stroke="#30363D" opacity="1"/><text x="42" y="176" font-size="13" fill="#F75C7E" font-weight="600">AI / ML</text><text x="200" y="176" font-size="14" fill="#E6EDF3" font-weight="400">Python · PyTorch · TensorFlow · scikit-learn</text><text x="42" y="223" font-size="13" fill="#F75C7E" font-weight="600">DATA / BACKEND</text><text x="200" y="223" font-size="14" fill="#E6EDF3" font-weight="400">PostgreSQL · MongoDB · Redis · Node.js</text><text x="42" y="270" font-size="13" fill="#F75C7E" font-weight="600">PLATFORM</text><text x="200" y="270" font-size="14" fill="#E6EDF3" font-weight="400">Docker · Kubernetes · AWS · Azure · Grafana · Linux ·</text><text x="200" y="290" font-size="14" fill="#E6EDF3" font-weight="400">Git</text><text x="42" y="317" font-size="13" fill="#F75C7E" font-weight="600">PRODUCT</text><text x="200" y="317" font-size="14" fill="#E6EDF3" font-weight="400">TypeScript · React · Next.js · Tailwind CSS</text><line x1="690" y1="153" x2="690" y2="348" stroke="#30363D" opacity="1"/><text x="824" y="179" font-size="12" fill="#8B949E" font-weight="600" text-anchor="middle">DELIVERY LOOP</text><text x="824" y="215" font-size="13" fill="#E6EDF3" font-weight="500" text-anchor="middle">BUILD → TEST → SECURE</text><text x="824" y="246" font-size="13" fill="#E6EDF3" font-weight="500" text-anchor="middle">OBSERVE → ITERATE</text><text x="824" y="280" font-size="13" fill="#F75C7E" font-weight="600" text-anchor="middle">SHIP WITH EVIDENCE</text><line x1="42" y1="371" x2="958" y2="371" stroke="#30363D" opacity="1"/><text x="500" y="397" font-size="12" fill="#8B949E" font-weight="500" text-anchor="middle">SYSTEMS ARE THE PRODUCT · MODELS ARE ONE COMPONENT</text></g></svg>

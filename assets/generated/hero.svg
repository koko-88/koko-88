<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-label="Kerolos Mounir — AI Full-Stack Engineer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset=".55" stop-color="#111722"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="42%" r="58%"><stop offset="0" stop-color="#F75C7E" stop-opacity=".22"/><stop offset=".55" stop-color="#F75C7E" stop-opacity=".05"/><stop offset="1" stop-color="#F75C7E" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".04" stroke-width="1"/></pattern>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clipType1"><rect x="250" y="154" width="0" height="30"><animate attributeName="width" values="0;500;500;0;0" keyTimes="0;.08;.27;.33;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="clipType2"><rect x="190" y="154" width="0" height="30"><animate attributeName="width" values="0;0;0;620;620;0;0" keyTimes="0;.33;.39;.47;.60;.66;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="clipType3"><rect x="245" y="154" width="0" height="30"><animate attributeName="width" values="0;0;0;510;510;0" keyTimes="0;.66;.72;.80;.94;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}
  .scan{animation:scan 6s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(-70px);opacity:0}15%{opacity:.6}55%{opacity:.13}80%{transform:translateY(360px);opacity:0}}
  .dash{stroke-dasharray:8 12;animation:dash 11s linear infinite}@keyframes dash{to{stroke-dashoffset:-320}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .blink{animation:blink 1.1s steps(2,end) infinite}@keyframes blink{50%{opacity:.18}}
  @media(prefers-reduced-motion:reduce){.scan,.dash,.pulse,.blink{animation:none!important}}
</style>

<rect width="1000" height="390" rx="26" fill="url(#bg)"/>
<rect x="1" y="1" width="998" height="388" rx="25" fill="none" stroke="#30363D"/>

<rect x="24" y="20" width="952" height="350" fill="url(#grid)"/>
<ellipse cx="500" cy="145" rx="460" ry="220" fill="url(#glow)"/>

<g fill="none" stroke="#F75C7E" stroke-width="1.2" opacity=".54" class="dash">
  <path d="M58 238 C180 168 220 263 350 188 S565 113 700 183 S845 258 955 198"/>
  <path d="M70 72 C190 140 270 68 380 112 S590 190 720 118 S870 55 945 98" stroke-opacity=".45"/>
</g>

<g fill="#F75C7E" filter="url(#softGlow)">
  <circle cx="160" cy="198" r="3" class="pulse"/><circle cx="350" cy="188" r="3" class="pulse"/>
  <circle cx="700" cy="183" r="3" class="pulse"/><circle cx="845" cy="231" r="3" class="pulse"/>
  <circle cx="275" cy="96" r="2.5" class="pulse"/><circle cx="720" cy="118" r="2.5" class="pulse"/>
</g>

<rect x="26" y="-28" width="948" height="52" fill="url(#glow)" opacity=".55" class="scan"/>

<g class="mono">
  <text x="54" y="54" fill="#8B949E" font-size="12" letter-spacing="2.5">KER // AI SYSTEMS</text>
  <text x="940" y="54" fill="#8B949E" font-size="12" text-anchor="end"><tspan fill="#F75C7E" class="blink">●</tspan> BUILDING</text>
  <text x="500" y="129" fill="#E6EDF3" font-size="50" font-weight="700" text-anchor="middle" letter-spacing="1">KEROLOS MOUNIR</text>

  <g fill="#F75C7E" font-size="18" font-weight="600" letter-spacing="1.2">
    <text x="500" y="175" text-anchor="middle" clip-path="url(#clipType1)">AI Full-Stack Engineer</text>
    <text x="500" y="175" text-anchor="middle" clip-path="url(#clipType2)">Building Production AI &amp; Data Systems</text>
    <text x="500" y="175" text-anchor="middle" clip-path="url(#clipType3)">Always learning, always shipping</text>
  </g>

  <rect x="745" y="158" width="9" height="20" rx="1.5" fill="#F75C7E" class="blink"/>
  <text x="500" y="218" fill="#8B949E" font-size="13" text-anchor="middle">PRODUCTION AI  •  DATA SYSTEMS  •  AGENTIC WORKFLOWS</text>
  <text x="500" y="257" fill="#8B949E" font-size="11" text-anchor="middle" letter-spacing="1.8">BUILD  /  VERIFY  /  OBSERVE  /  SHIP</text>
</g>

<line x1="210" y1="286" x2="790" y2="286" stroke="#30363D" stroke-width="1"/>

<!-- socials integrated into the hero artwork -->
<g transform="translate(330,308)">
  <g transform="translate(0,0)">
    <rect width="54" height="54" rx="15" fill="#161B22" stroke="#30363D"/>
    <g fill="#F75C7E"><rect x="13" y="23" width="6" height="18"/><circle cx="16" cy="16.5" r="3.3"/><path d="M23 23h5.8v2.5c1.7-2 4-3.2 6.7-3.2 6.1 0 7.5 4 7.5 9.3V41h-6v-8.3c0-2.4 0-5.5-3.4-5.5s-4 2.6-4 5.3V41H23z"/></g>
  </g>
  <g transform="translate(72,0)">
    <rect width="54" height="54" rx="15" fill="#161B22" stroke="#30363D"/><text x="27" y="35" fill="#F75C7E" text-anchor="middle" class="mono" font-size="24" font-weight="700">K</text>
  </g>
  <g transform="translate(144,0)">
    <rect width="54" height="54" rx="15" fill="#161B22" stroke="#30363D"/><path d="M12 18h30v20H12z" fill="none" stroke="#F75C7E" stroke-width="3"/><path d="M13 20l14 10 14-10" fill="none" stroke="#F75C7E" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g transform="translate(216,0)">
    <rect width="54" height="54" rx="15" fill="#161B22" stroke="#30363D"/><circle cx="27" cy="27" r="13" fill="none" stroke="#F75C7E" stroke-width="2.6"/><path d="M14 27h26M27 14c5 5 5 21 0 26M27 14c-5 5-5 21 0 26" fill="none" stroke="#F75C7E" stroke-width="2.1"/>
  </g>
  <g transform="translate(288,0)">
    <rect width="54" height="54" rx="15" fill="#161B22" stroke="#30363D"/><path d="M18 12h13l7 7v23H18z" fill="none" stroke="#F75C7E" stroke-width="2.5"/><path d="M31 12v8h8M22 26h12M22 31h12M22 36h9" fill="none" stroke="#F75C7E" stroke-width="2.1"/>
  </g>
</g>
</svg>
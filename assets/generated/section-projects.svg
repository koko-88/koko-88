  <radialGradient id="glow" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#F75C7E" stop-opacity=".15"/><stop offset="1" stop-color="#F75C7E" stop-opacity="0"/></radialGradient>
  <clipPath id="p1"><rect x="350" y="72" width="0" height="22"><animate attributeName="width" values="0;300;300;0;0" keyTimes="0;.1;.28;.34;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="p2"><rect x="292" y="72" width="0" height="22"><animate attributeName="width" values="0;0;0;416;416;0;0" keyTimes="0;.34;.41;.50;.62;.68;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>

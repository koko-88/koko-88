<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="425" viewBox="0 0 1000 425" role="img" aria-label="Engineering Surface: AI, data, platform, product, and delivery"><defs><clipPath id="surf1"><rect x="385" y="71" width="0" height="22"><animate attributeName="width" values="0;230;230;0;0" keyTimes="0;.10;.28;.34;1" dur="10s" repeatCount="indefinite"/></rect></clipPath><clipPath id="surf2"><rect x="345" y="71" width="0" height="22"><animate attributeName="width" values="0;0;0;310;310;0;0" keyTimes="0;.34;.41;.50;.62;.68;1" dur="10s" repeatCount="indefinite"/></rect></clipPath><clipPath id="surf3"><rect x="315" y="71" width="0" height="22"><animate attributeName="width" values="0;0;0;370;370;0" keyTimes="0;.68;.75;.84;.94;1" dur="10s" repeatCount="indefinite"/></rect></clipPath></defs><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.blink{animation:blink 1.1s steps(2,end) infinite}@keyframes blink{50%{opacity:.18}}@media(prefers-reduced-motion:reduce){.blink{animation:none!important}.typed{clip-path:none!important}.typed.t2,.typed.t3{display:none}}</style><g class="mono"><rect x="1" y="1" width="998" height="423" rx="22" fill="#161B22" stroke="#30363D" stroke-width="1"/><text x="500" y="52" font-size="23" fill="#E6EDF3" font-weight="700" text-anchor="middle" letter-spacing="1">ENGINEERING SURFACE</text><g font-size="12" fill="#F75C7E" font-weight="500" text-anchor="middle"><text class="typed t1" x="500" y="85" clip-path="url(#surf1)">MODEL → SYSTEM</text><text class="typed t2" x="500" y="85" clip-path="url(#surf2)">BUILD → TEST → SECURE</text><text class="typed t3" x="500" y="85" clip-path="url(#surf3)">OBSERVE → ITERATE → SHIP</text></g><rect x="694" y="73" width="6" height="15" rx="1" fill="#F75C7E" class="blink"/><text x="500" y="109" font-size="12" fill="#8B949E" font-weight="400" text-anchor="middle">AI · DATA · PLATFORM · PRODUCT · DELIVERY</text><line x1="42" y1="130" x2="958" y2="130" stroke="#30363D" opacity="1"/><text x="42" y="176" font-size="13" fill="#F75C7E" font-weight="600">AI / ML</text><text x="200" y="176" font-size="14" fill="#E6EDF3" font-weight="400">Python · PyTorch · TensorFlow · scikit-learn</text><text x="42" y="223" font-size="13" fill="#F75C7E" font-weight="600">DATA / BACKEND</text><text x="200" y="223" font-size="14" fill="#E6EDF3" font-weight="400">PostgreSQL · MongoDB · Redis · Node.js</text><text x="42" y="270" font-size="13" fill="#F75C7E" font-weight="600">PLATFORM</text><text x="200" y="270" font-size="14" fill="#E6EDF3" font-weight="400">Docker · Kubernetes · AWS · Azure · Grafana · Linux ·</text><text x="200" y="290" font-size="14" fill="#E6EDF3" font-weight="400">Git</text><text x="42" y="317" font-size="13" fill="#F75C7E" font-weight="600">PRODUCT</text><text x="200" y="317" font-size="14" fill="#E6EDF3" font-weight="400">TypeScript · React · Next.js · Tailwind CSS</text><line x1="690" y1="153" x2="690" y2="348" stroke="#30363D" opacity="1"/><text x="824" y="179" font-size="12" fill="#8B949E" font-weight="600" text-anchor="middle">DELIVERY LOOP</text><text x="824" y="215" font-size="13" fill="#E6EDF3" font-weight="500" text-anchor="middle">BUILD → TEST → SECURE</text><text x="824" y="246" font-size="13" fill="#E6EDF3" font-weight="500" text-anchor="middle">OBSERVE → ITERATE</text><text x="824" y="280" font-size="13" fill="#F75C7E" font-weight="600" text-anchor="middle">SHIP WITH EVIDENCE</text><line x1="42" y1="371" x2="958" y2="371" stroke="#30363D" opacity="1"/><text x="500" y="397" font-size="12" fill="#8B949E" font-weight="500" text-anchor="middle">SYSTEMS ARE THE PRODUCT · MODELS ARE ONE COMPONENT</text></g></svg>

<defs><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>.m{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace}.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif}.flow{stroke-dasharray:7 10;animation:f 7s linear infinite}@keyframes f{to{stroke-dashoffset:-170}}.p{animation:p 2s ease-in-out infinite}@keyframes p{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.flow,.p{animation:none}}</style>

</defs>
<style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.blink{animation:b 1.1s steps(2,end) infinite}@keyframes b{50%{opacity:.18}}@media(prefers-reduced-motion:reduce){.blink{animation:none}}</style>
<rect x="1" y="1" width="998" height="126" rx="18" fill="url(#bg)" stroke="#30363D"/>
<rect x="1" y="1" width="998" height="126" rx="18" fill="url(#glow)"/>

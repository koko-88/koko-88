<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Kerolos Mounir — AI Full-Stack Engineer"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#E6EDF3" stroke-opacity=".045"/></pattern><radialGradient id="halo"><stop stop-color="#F75C7E" stop-opacity=".17"/><stop offset="1" stop-color="#F75C7E" stop-opacity="0"/></radialGradient><clipPath id="heroType1"><rect x="315" y="185" width="0" height="26"><animate attributeName="width" values="0;370;370;0;0" keyTimes="0;.12;.42;.50;1" dur="8s" repeatCount="indefinite"/></rect></clipPath><clipPath id="heroType2"><rect x="330" y="185" width="0" height="26"><animate attributeName="width" values="0;0;0;340;340;0" keyTimes="0;.50;.58;.70;.92;1" dur="8s" repeatCount="indefinite"/></rect></clipPath></defs><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace}.signal{stroke-dasharray:7 13;animation:drift 12s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.blink{animation:blink 1.1s steps(2,end) infinite}.scan{animation:scan 7s ease-in-out infinite}@keyframes drift{to{stroke-dashoffset:-160}}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:.18}}@keyframes scan{0%,100%{transform:translateY(-58px);opacity:0}18%{opacity:.38}55%{opacity:.09}82%{transform:translateY(315px);opacity:0}}@media(prefers-reduced-motion:reduce){.signal,.pulse,.blink,.scan{animation:none!important}.typed-secondary{clip-path:none!important}.typed-secondary.t2{display:none}}</style><g class="mono"><rect x="1" y="1" width="998" height="298" rx="22" fill="#0D1117" stroke="#30363D" stroke-width="1"/><rect x="24" y="20" width="952" height="260" rx="16" fill="url(#grid)" stroke="none" stroke-width="1"/><ellipse cx="500" cy="145" rx="410" ry="190" fill="url(#halo)"/><rect x="26" y="-32" width="948" height="48" fill="url(#halo)" opacity=".34" class="scan"/><g fill="none" stroke="#F75C7E" stroke-width="1.2" stroke-opacity=".28" class="signal"><path d="M58 238 C180 168 220 263 350 188 S565 113 700 183 S845 258 955 198"/><path d="M70 72 C190 140 270 68 380 112 S590 190 720 118 S870 55 945 98"/></g><circle cx="160" cy="198" r="3" fill="#F75C7E" class="pulse"/><circle cx="350" cy="188" r="3" fill="#F75C7E" class="pulse"/><circle cx="700" cy="183" r="3" fill="#F75C7E" class="pulse"/><circle cx="845" cy="231" r="3" fill="#F75C7E" class="pulse"/><circle cx="275" cy="96" r="3" fill="#F75C7E" class="pulse"/><circle cx="720" cy="118" r="3" fill="#F75C7E" class="pulse"/><text x="54" y="54" font-size="12" fill="#8B949E" font-weight="500" letter-spacing="2">KER // AI SYSTEMS</text><text x="944" y="54" font-size="12" fill="#8B949E" font-weight="500" text-anchor="end" letter-spacing="1"><tspan fill="#F75C7E" class="blink">●</tspan> BUILDING</text><text x="500" y="129" font-size="50" fill="#E6EDF3" font-weight="700" text-anchor="middle" letter-spacing="1">KEROLOS MOUNIR</text><text x="500" y="169" font-size="19" fill="#F75C7E" font-weight="600" text-anchor="middle" letter-spacing="1">AI Full-Stack Engineer</text><g fill="#BFC6CE" font-size="13" font-weight="400"><text class="typed-secondary t1" x="500" y="203" text-anchor="middle" clip-path="url(#heroType1)">Building Production AI &amp; Data Systems</text><text class="typed-secondary t2" x="500" y="203" text-anchor="middle" clip-path="url(#heroType2)">Always learning, always shipping</text></g><rect x="692" y="190" width="7" height="17" rx="1" fill="#F75C7E" class="blink"/><text x="500" y="245" font-size="13" fill="#8B949E" font-weight="500" text-anchor="middle">PRODUCTION AI  •  DATA SYSTEMS  •  AGENTIC WORKFLOWS</text><text x="500" y="275" font-size="12" fill="#8B949E" font-weight="500" text-anchor="middle" letter-spacing="1.2">BUILD  /  VERIFY  /  OBSERVE  /  SHIP</text></g></svg>
